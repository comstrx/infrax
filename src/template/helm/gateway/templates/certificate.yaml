{{- if and .Values.tlsEnabled .Values.hostnames }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tlsSecret }}
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  secretName: {{ .Values.tlsSecret }}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    {{- toYaml .Values.hostnames | nindent 4 }}
{{- end }}
