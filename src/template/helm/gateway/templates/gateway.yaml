apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          {{- include "gateway.routeNamespaces" . | nindent 10 }}
{{- if .Values.tlsEnabled }}

    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          {{- include "gateway.routeNamespaces" . | nindent 10 }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.tlsSecret }}
            group: ""
            kind: Secret
{{- end }}
