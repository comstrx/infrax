{{- if and .Values.processes.web (gt (int .Values.autoscaling.min) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "service.name" . }}-web
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "service.selector" (merge (dict "component" "web") .) | nindent 6 }}
{{- end }}
