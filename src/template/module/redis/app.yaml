apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${SEED_NAME}-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ${SEED_PROJECT}
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-redis-exporter
    targetRevision: ${REDIS_EXPORTER_VERSION}
    helm:
      valuesObject:
        podLabels:
          infrax.io/peer: ${SEED_NAME}
        redisAddress: redis://${SEED_NAME}:${SEED_PORT}
        auth:
          enabled: true
          secret:
            name: ${SEED_NAME}-secrets
            key: ROOT_PASSWORD
        serviceMonitor:
          enabled: true
          namespace: ${SEED_METRICS_NAMESPACE}
        extraArgs:
          check-keys: "${REDIS_EXPORTER_KEYS}"
  destination:
    server: https://kubernetes.default.svc
    namespace: ${SEED_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
