__PMA_LIMIT_RULES__

server {
    listen 80;
    server_name __PMA_DOMAIN__;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name __PMA_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__PMA_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PMA_DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    root /usr/share/phpmyadmin;
    index index.php index.html;

    client_max_body_size __PMA_MAX_BODY_SIZE__;

    access_log __PMA_ACCESS_LOG__;
    error_log  __PMA_ERROR_LOG__;

    __PMA_AUTH_RULES__

    __PMA_ACCESS_RULES__

    location = /phpmyadmin {
        return 301 /;
    }
    location /phpmyadmin/ {
        return 301 /;
    }
    location / {
        __PMA_LIMIT_USE__
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCKET__;
        fastcgi_read_timeout 300s;
    }
    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt|woff2?|svg|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    location ~* /(composer|package(-lock)?|yarn\.lock|pnpm-lock)\.json$ {
        deny all;
    }
    location ~ /\.(git|svn|ht|env) {
        deny all;
    }
    location ~ /\.ht {
        deny all;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
